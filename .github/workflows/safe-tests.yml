name: Safe Bot Tests

on:
  push:
    branches: ["main", "improve/safe-execution-guards"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  safe-tests:
    name: Compile and safe unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOBITEX_API_ENV: testnet
      NOBITEX_TEST_MODE: "true"
      NOBITEX_PUBLIC_MARKET_FALLBACK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile nobitex_bot.py test_bot_safe.py
      - name: Run safe unit tests
        run: python test_bot_safe.py
