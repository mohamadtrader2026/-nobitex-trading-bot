name: Nobitex Periodic Bot

on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "17 6 * * *"
    - cron: "17 12 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: nobitex-periodic-bot
  cancel-in-progress: false

jobs:
  periodic-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NOBITEX_API_ENV: testnet
      NOBITEX_TEST_MODE: "true"
      NOBITEX_MAX_RUNTIME_SECONDS: "21600"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: bot_state.json
          key: nobitex-bot-state-${{ github.run_id }}
          restore-keys: |
            nobitex-bot-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run safe bot for this cycle
        run: |
          test -f bot_state.json || printf '{"in_position":false,"entry_price":0,"amount":0}\n' > bot_state.json
          python nobitex_bot.py

      - name: Save bot state
        uses: actions/cache/save@v4
        with:
          path: bot_state.json
          key: nobitex-bot-state-${{ github.run_id }}
