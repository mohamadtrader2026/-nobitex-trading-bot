name: Nobitex Continuous Test Cycle

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

concurrency:
  group: nobitex-continuous-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cycle-1:
    name: Cycle 1 (6 hours)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NOBITEX_API_ENV: testnet
      NOBITEX_TEST_MODE: "true"
      NOBITEX_PUBLIC_MARKET_FALLBACK: "true"
      NOBITEX_MAX_RUNTIME_SECONDS: "21600"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Initialize state
        run: echo '{"in_position":false,"entry_price":0,"amount":0}' > bot_state.json
      - name: Run safe bot
        run: python nobitex_bot.py
      - name: Save state for cycle 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-state-cycle-1
          path: bot_state.json
          if-no-files-found: ignore
          retention-days: 1

  cycle-2:
    name: Cycle 2 (6 hours)
    needs: cycle-1
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NOBITEX_API_ENV: testnet
      NOBITEX_TEST_MODE: "true"
      NOBITEX_PUBLIC_MARKET_FALLBACK: "true"
      NOBITEX_MAX_RUNTIME_SECONDS: "21600"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore state from cycle 1
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: bot-state-cycle-1
      - name: Initialize state if needed
        run: test -f bot_state.json || echo '{"in_position":false,"entry_price":0,"amount":0}' > bot_state.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run safe bot
        run: python nobitex_bot.py
      - name: Save state for cycle 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-state-cycle-2
          path: bot_state.json
          if-no-files-found: ignore
          retention-days: 1

  cycle-3:
    name: Cycle 3 (6 hours)
    needs: cycle-2
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NOBITEX_API_ENV: testnet
      NOBITEX_TEST_MODE: "true"
      NOBITEX_PUBLIC_MARKET_FALLBACK: "true"
      NOBITEX_MAX_RUNTIME_SECONDS: "21600"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore state from cycle 2
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: bot-state-cycle-2
      - name: Initialize state if needed
        run: test -f bot_state.json || echo '{"in_position":false,"entry_price":0,"amount":0}' > bot_state.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run safe bot
        run: python nobitex_bot.py
      - name: Save state for cycle 4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-state-cycle-3
          path: bot_state.json
          if-no-files-found: ignore
          retention-days: 1

  cycle-4:
    name: Cycle 4 (6 hours)
    needs: cycle-3
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NOBITEX_API_ENV: testnet
      NOBITEX_TEST_MODE: "true"
      NOBITEX_PUBLIC_MARKET_FALLBACK: "true"
      NOBITEX_MAX_RUNTIME_SECONDS: "21600"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore state from cycle 3
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: bot-state-cycle-3
      - name: Initialize state if needed
        run: test -f bot_state.json || echo '{"in_position":false,"entry_price":0,"amount":0}' > bot_state.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run safe bot
        run: python nobitex_bot.py
      - name: Save final state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-state-cycle-4
          path: bot_state.json
          if-no-files-found: ignore
          retention-days: 1
