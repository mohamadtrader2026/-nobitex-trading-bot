name: Nobitex Safe Smoke Test
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nobitex-manual-safe-check
  cancel-in-progress: false

jobs:
  bot:
    name: Manual safe check
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      NOBITEX_API_ENV: testnet
      NOBITEX_TEST_MODE: "true"
      NOBITEX_PUBLIC_MARKET_FALLBACK: "true"
      NOBITEX_MAX_RUNTIME_SECONDS: "300"
      NOBITEX_CHECK_SECONDS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run safe unit test
        run: python test_bot_safe.py
