name: Nobitex Testnet Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testnet-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      NOBITEX_API_ENV: testnet
      NOBITEX_TEST_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python test_bot_safe.py
