name: Nobitex Testnet Check

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  testnet-check:
    runs-on: ubuntu-latest
    env:
      NOBITEX_API_ENV: testnet
      NOBITEX_TEST_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run safe bot tests
        run: python test_bot_safe.py

      - name: Diagnose Nobitex Testnet DNS and API
        run: |
          python - <<'PY'
          import socket
          import requests

          host = "testnetapi.nobitex.ir"
          url = f"https://{host}/v2/trades/BTCIRT"

          print("Checking DNS:", host)
          try:
              addresses = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
              print("DNS: OK")
              print("Addresses:", sorted({a[4][0] for a in addresses}))
          except Exception as exc:
              print("DNS: FAILED")
              print(type(exc).__name__ + ":", exc)
              raise SystemExit(0)

          print("Checking HTTPS:", url)
          try:
              r = requests.get(url, timeout=15)
              print("HTTP status:", r.status_code)
              print("Response content-type:", r.headers.get("content-type", ""))
              r.raise_for_status()
              data = r.json()
              print("API status:", data.get("status"))
              print("Trade count:", len(data.get("trades", [])))
              if data.get("status") == "ok" and data.get("trades"):
                  print("Nobitex Testnet public API: OK")
              else:
                  print("Nobitex Testnet public API: reachable, but response was not the expected market-data shape")
          except Exception as exc:
              print("HTTPS/API: FAILED")
              print(type(exc).__name__ + ":", exc)
              raise SystemExit(0)
          PY
