name: Nobitex Bootstrap Safe Cycle
on:
  push:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: nobitex-bootstrap-cycle
  cancel-in-progress: false
jobs:
  cycle-1:
    name: Safe cycle 1 (6h)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      NOBITEX_API_ENV: testnet
      NOBITEX_TEST_MODE: "true"
      NOBITEX_PUBLIC_MARKET_FALLBACK: "true"
      NOBITEX_MAX_RUNTIME_SECONDS: "21600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python test_bot_safe.py
        continue-on-error: true
      - run: python nobitex_bot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nobitex-state-cycle-1
          path: bot_state.json
          if-no-files-found: ignore
          retention-days: 1
  cycle-2:
    name: Safe cycle 2 (6h)
    needs: cycle-1
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      NOBITEX_API_ENV: testnet
      NOBITEX_TEST_MODE: "true"
      NOBITEX_PUBLIC_MARKET_FALLBACK: "true"
      NOBITEX_MAX_RUNTIME_SECONDS: "21600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nobitex-state-cycle-1
          path: .
      - run: python nobitex_bot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nobitex-state-cycle-2
          path: bot_state.json
          if-no-files-found: ignore
          retention-days: 1
  cycle-3:
    name: Safe cycle 3 (6h)
    needs: cycle-2
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      NOBITEX_API_ENV: testnet
      NOBITEX_TEST_MODE: "true"
      NOBITEX_PUBLIC_MARKET_FALLBACK: "true"
      NOBITEX_MAX_RUNTIME_SECONDS: "21600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nobitex-state-cycle-2
          path: .
      - run: python nobitex_bot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nobitex-state-cycle-3
          path: bot_state.json
          if-no-files-found: ignore
          retention-days: 1
  cycle-4:
    name: Safe cycle 4 (6h)
    needs: cycle-3
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      NOBITEX_API_ENV: testnet
      NOBITEX_TEST_MODE: "true"
      NOBITEX_PUBLIC_MARKET_FALLBACK: "true"
      NOBITEX_MAX_RUNTIME_SECONDS: "21600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nobitex-state-cycle-3
          path: .
      - run: python nobitex_bot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nobitex-state-cycle-4
          path: bot_state.json
          if-no-files-found: ignore
          retention-days: 1
