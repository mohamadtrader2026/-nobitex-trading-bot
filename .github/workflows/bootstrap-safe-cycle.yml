name: Nobitex Bootstrap Safe Cycle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cycle-1:
    name: Manual safe cycle (6h)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      NOBITEX_API_ENV: testnet
      NOBITEX_TEST_MODE: "true"
      NOBITEX_PUBLIC_MARKET_FALLBACK: "true"
      NOBITEX_MAX_RUNTIME_SECONDS: "21600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python test_bot_safe.py
      - run: python nobitex_bot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nobitex-state-manual-cycle
          path: bot_state.json
          if-no-files-found: ignore
          retention-days: 1
